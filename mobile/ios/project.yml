name: HoanAdmin
options:
  minimumXcodeGenVersion: '2.42.0'
  deploymentTarget:
    iOS: '15.0'
  developmentLanguage: vi
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HoanAdmin:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: HoanAdmin
        excludes:
          - Info.plist
      - path: .generated/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.hoanmakeup.admin
        PRODUCT_NAME: HoanAdmin
        INFOPLIST_FILE: .generated/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  HoanAdmin:
    build:
      targets:
        HoanAdmin: all
    run:
      config: Debug
    archive:
      config: Release
